<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private Campaign Analytics</title><style>body{font-family:system-ui;margin:0;background:#0b1d2a;color:#f7f2e8}main{max-width:1100px;margin:auto;padding:24px}.card{background:#132b3a;border:1px solid #315064;border-radius:14px;padding:18px;margin:12px 0}input,button,select{font:inherit;padding:12px;border-radius:9px;border:1px solid #789}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.big{font-size:2rem;font-weight:800}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #315064}#dash{display:none}@media(max-width:650px){main{padding:12px}.card{overflow:auto}}</style></head><body><main><h1>Private Campaign Analytics</h1><section id="login" class="card"><h2>Admin Login</h2><form id="loginForm"><input id="pw" type="password" autocomplete="current-password" required placeholder="Password"><button>Sign in</button></form><p id="loginMsg"></p></section><section id="dash"><div class="card"><label>Range <select id="days"><option value="1">Today</option><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="0">All time</option></select></label> <button id="refresh">Refresh</button></div><div id="summary" class="grid"></div><div class="card"><h2>Most Viewed Pages</h2><div id="pages"></div></div><div class="card"><h2>Top Research Searches</h2><div id="searches"></div></div><div class="card"><h2>Referring Sources / Campaigns</h2><div id="refs"></div></div><div class="card"><h2>Network Types</h2><div id="nets"></div></div><div class="card"><h2>Recent Anonymous Activity</h2><div id="recent"></div></div></section><script src="/assets/admin-analytics.js"></script></main></body></html>
