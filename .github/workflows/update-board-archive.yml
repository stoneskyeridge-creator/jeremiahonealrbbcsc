name: Update RBBCSC board archive

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'scripts/build-board-archive.js'
      - 'scripts/add-home-archive-search.js'
      - '.github/workflows/update-board-archive.yml'
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Test board archive/search code
        run: node --test tests/board-archive.test.js tests/board-search-aliases.test.js tests/board-search.test.js tests/transcript-fuzzy.test.js tests/transcript-viewer.test.js
      - run: npm run build:board-archive
      - name: Add homepage archive search
        run: node scripts/add-home-archive-search.js
      - name: Re-test board archive/search code
        run: node --test tests/board-archive.test.js tests/board-search-aliases.test.js tests/board-search.test.js tests/transcript-fuzzy.test.js tests/transcript-viewer.test.js
      - name: Validate built archive search
        run: node scripts/validate-board-archive.js
      - name: Commit refreshed archive and homepage search
        run: |
          if git diff --quiet -- data/search-index.json data/search-shards data/meetings.json data/transcript-index index.html; then
            echo "No archive or homepage changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/search-index.json data/search-shards data/meetings.json data/transcript-index index.html
          git commit -m "data: refresh RBBCSC board archive and homepage search"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
